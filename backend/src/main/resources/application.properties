spring.application.name=questionpool
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/questionpool}
spring.datasource.username=${DB_USER:questionpool}
spring.datasource.password=${DB_PASSWORD:questionpool}

# Mail: when SMTP_HOST is empty no mail is sent and login links are written to the log (development).
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000

spring.web.error.include-message=always
server.forward-headers-strategy=framework

app.base-url=${APP_BASE_URL:http://localhost:8080}
app.mail-from=${MAIL_FROM:}
# Exchange Web Services address. When set, mail goes through EWS (NTLM, with SMTP_USER and SMTP_PASSWORD), not SMTP.
app.ews-url=${EWS_URL:}
# Comma-separated lists: every INSTRUCTOR_EMAIL entry becomes an instructor account, the same-order
# INSTRUCTOR_NAME entry is its full name (a missing name falls back to the part before the @).
app.instructor-emails=${INSTRUCTOR_EMAIL:}
app.instructor-names=${INSTRUCTOR_NAME:G\u00f6k\u00e7er G\u00f6kdal}
app.secure-cookies=${SECURE_COOKIES:false}
app.questions-per-chapter=${QUESTIONS_PER_CHAPTER:2}
app.ask-ai-per-day=${ASK_AI_PER_DAY:10}
app.chapter-docs-dir=${CHAPTER_DOCS_DIR:}
app.openrouter-url=${OPENROUTER_URL:https://openrouter.ai/api/v1/chat/completions}
app.openrouter-key=${OPENROUTER_API_KEY:}
app.openrouter-model=${OPENROUTER_MODEL:anthropic/claude-sonnet-5.5}
spring.jackson.property-naming-strategy=SNAKE_CASE
