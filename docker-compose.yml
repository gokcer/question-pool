services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: questionpool
      POSTGRES_USER: questionpool
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U questionpool"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    # Docker Hub name. `docker compose build` tags it locally, `docker compose push app` publishes it.
    image: armikom/question-pool:latest
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/questionpool
      DB_USER: questionpool
    ports:
      # Only on localhost: put your reverse proxy (HTTPS) in front of it.
      - "127.0.0.1:${APP_PORT:-8080}:8080"

volumes:
  pgdata:
